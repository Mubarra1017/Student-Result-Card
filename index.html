<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Student Result Card</h1>
        <h2>Student Details</h2>
        <label for="name">Student Name:</label>
        <input type="text" id="name" placeholder="Enter Student Name">
        <label for="fathername">Father's Name:</label> 
        <input type="text" id="fathername" placeholder="Enter Father's Name">
        <label for="roll">Roll Number:</label>
        <input type="text" id="roll" placeholder="Enter Roll Number">
        <label for="class">Class:</label>
        <input type="text" id="class" placeholder="Enter Class">
        <h2>Enter Subject Marks</h2>
        <label for="eng">English:</label>
        <input type="number" id="eng" placeholder="Out of 100">
        <label for="urdu">Urdu:</label>
        <input type="number" id="urdu" placeholder="Out of 100">
        <label for="math">Mathematics:</label>
        <input type="number" id="math" placeholder="Out of 100">
        <label for="phy">Physics:</label>
        <input type="number" id="phy" placeholder="Out of 100">
        <label for="comp">Computer:</label>
        <input type="number" id="comp" placeholder="Out of 100">
        <label for="chem">Chemistry:</label>
        <input type="number" id="chem" placeholder="Out of 100">
        <label for="isl">Islamiyat:</label>
        <input type="number" id="isl" placeholder="Out of 100">
        <label for="pak">Pakistan Studies:</label>
        <input type="number" id="pak" placeholder="Out of 100">
        <button onclick="generateMarksheet()">
            Generate Marksheet
        </button>
    </div>
    <script src="script.js"></script>
</body>
</html>
